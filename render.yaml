services:
  - type: web
    name: deepverify-backend
    env: python
    plan: free
    buildCommand: bash render_build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: EXP001_SPATIAL_WEIGHTS_PATH
        value: models/spatial_model_best.pth
      - key: EXP002_FREQUENCY_WEIGHTS_PATH
        value: models/frequency_model_best.pth
      - key: EXP001_SPATIAL_CONFIG_PATH
        value: experiments/configs/EXP-001.yaml
      - key: EXP002_FREQUENCY_CONFIG_PATH
        value: experiments/configs/EXP-002.yaml
