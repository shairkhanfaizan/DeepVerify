version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: deepverify_postgres
    restart: always
    environment:
      POSTGRES_USER: deepverify
      POSTGRES_PASSWORD: deepverify_password
      POSTGRES_DB: deepverify_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
