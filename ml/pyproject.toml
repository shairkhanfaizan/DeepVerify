[project]
name = "deepverify-ml"
version = "0.1.0"
description = "DeepVerify ML pipeline — preprocessing, training, and evaluation for deepfake detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Imaging
    "Pillow>=10.0",
    "numpy>=1.24",

    # Deep Learning (CPU-only wheels; GPU support added via torch index-url in uv.lock)
    "torch>=2.0",
    "torchvision>=0.15",

    # Dataset & experiment management
    "kaggle>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",

    # Metrics
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepverify_ml"]

[tool.hatch.build.targets.editable]
packages = ["deepverify_ml"]

[tool.uv.sources]
# Override torch to CUDA wheel index when training on GPU (override locally as needed):
# torch = { index = "https://download.pytorch.org/whl/cu121" }

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
