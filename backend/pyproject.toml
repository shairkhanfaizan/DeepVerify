[project]
name = "deepverify-backend"
version = "0.1.0"
description = "FastAPI backend for DeepVerify"
authors = [{ name = "Antigravity", email = "antigravity@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "pillow",
    "matplotlib",
    "deepverify-ml"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
deepverify-ml = { path = "../ml", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
