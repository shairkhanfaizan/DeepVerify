[project]
name = "deepverify-backend"
version = "2.0.0"
description = "FastAPI backend for DeepVerify"
authors = [{ name = "Antigravity", email = "antigravity@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic[email]",
    "pydantic-settings",
    "pillow",
    "matplotlib",
    "deepverify-ml",
    "sqlalchemy[asyncio]>=2.1.4",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "psycopg2-binary>=2.9.13",
    "greenlet>=3.5.6",
    "filetype>=1.2.0",
    "aiofiles>=25.1.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
deepverify-ml = { path = "../ml", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
